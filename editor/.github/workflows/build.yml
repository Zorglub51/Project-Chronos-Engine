name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: PCE-Game-Editor-Windows
          path: src-tauri/target/release/pce-game-editor.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: PCE-Game-Editor-macOS
          path: src-tauri/target/release/pce-game-editor
