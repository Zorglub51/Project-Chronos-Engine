name: Editor frontend checks

on:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'editor/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

# Native builds and Rust tests run in the private pce-pcd-rust repository.
# Its Build Chronos editor workflow checks out this public repository and
# resolves the pinned converter revision locally, without a cross-repo secret.
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - name: Explain native build location
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Editor validation
          Frontend tests ran in this public repository. This check does not compile the native application.

          Native builds and Rust tests run on demand in the private `pce-pcd-rust` repository,
          where the pinned converter dependency is accessible. Published downloads are available
          on the [release page](https://github.com/Zorglub51/Project-Chronos-Engine/releases).
          See [CI and release builds](https://github.com/Zorglub51/Project-Chronos-Engine/blob/main/docs/CI.md) for the workflow split.
          EOF
