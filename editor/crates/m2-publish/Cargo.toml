[package]
name = "m2-publish"
version = "0.1.0"
edition = "2021"
description = "Publish a PCE Mini game library into the deployable m2engage layout"

[lib]
name = "m2_publish"

[[bin]]
name = "m2-publish"
path = "src/bin/main.rs"

[dependencies]
m2-mzs = { path = "../m2-mzs" }
m2-psb = { path = "../m2-psb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
