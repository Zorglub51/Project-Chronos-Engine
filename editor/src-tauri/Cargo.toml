[package]
name = "pce-game-editor"
version = "2.0.0-alpha.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = "0.25"
m2-publish = { path = "../crates/m2-publish" }
m2-import = { path = "../crates/m2-import" }
pce-recovery = { path = "../../recovery/crates/pce-recovery" }
sha2 = "0.10"
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
