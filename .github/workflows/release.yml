name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows .exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor -> target

      - name: npm install
        run: npm install

      - name: Build (release)
        run: npx tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            editor/target/release/pce-game-editor.exe
            editor/target/release/bundle/nsis/*.exe
            editor/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-macos:
    name: macOS .app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor -> target

      - name: npm install
        run: npm install

      - name: Build (release, universal)
        run: npx tauri build --target universal-apple-darwin

      - name: Zip .app bundle
        run: |
          cd target/universal-apple-darwin/release/bundle/macos
          zip -ry "PCE-Game-Editor-macos-universal.zip" "PCE Game Editor.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            editor/target/universal-apple-darwin/release/bundle/macos/PCE-Game-Editor-macos-universal.zip
            editor/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded files
        run: find dist -type f -ls

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/windows/**/*
            dist/macos/**/*
